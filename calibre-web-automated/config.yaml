name: "Calibre-Web Automated (HyperCriSiS SSO Test)"
description: "HyperCriSiS test build with optional Home Assistant ingress SSO, based on CWA 4.0.6"
version: "4.0.6.1"
stage: experimental
slug: "calibre-web-automated"
init: false
arch:
  - aarch64
  - amd64
icon: false
url: "https://github.com/HyperCriSiS/hassio-addons-by-conallob/tree/feature/cwa-ingress-sso/calibre-web-automated"
panel_icon: "mdi:bookshelf"
panel_title: "CWA - HyperCriSiS SSO Test"
startup: services
ingress: true
ingress_port: 8084
ports:
  8083/tcp: null
ports_description:
  8083/tcp: "Calibre-Web Automated UI (optional direct access; ingress is recommended)"
map:
  - share:rw
options:
  library_dir: "calibre-web-automated/library"
  ingest_dir: "calibre-web-automated/ingest"
  network_share_mode: false
  sso:
    enabled: false
    admin_users: []
    admin_account: "admin"
    auto_create_users: false
schema:
  library_dir: "str"
  ingest_dir: "str"
  network_share_mode: "bool"
  sso:
    enabled: "bool"
    admin_users:
      - "match(^[0-9a-f]{32}$)"
    admin_account: "str"
    auto_create_users: "bool"
